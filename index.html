function parseDate(p, avail){

  if(/\bdomani\b/.test(p)){d=new Date(t);d.setDate(d.getDate()+1);return iso(d);}

      if(mon===null){d=new Date(t.getFullYear(),t.getMonth(),day);if(d<t)d=new Date(t.getFullYear(),t.getMonth()+1,day);}
      else{d=new Date(t.getFullYear(),mon,day);if(d<t)d=new Date(t.getFullYear()+1,mon,day);}

var cache={};
function demoSlots(z,v){var R={BS:function(w,am){return w===1||w===5;},BZ:function(w,am){return w>=1&&w<=4;},TN:function(w,am){return (w>=1&&w<=4&&!am)||(w>=2&&w<=4&&am);}};

  return out;}
function getSlots(cb){var key=S.z+"|"+S.v;if(cache[key])return cb(cache[key]);
  if(DEMO){setTimeout(function(){cache[key]=demoSlots(S.z,S.v);cb(cache[key]);},500);return;}
  fetch(API_URL+"?action=slots&z="+S.z+"&v="+S.v).then(function(r){return r.json();}).then(function(j){if(!j.ok)throw 0;cache[key]=j.days;cb(j.days);})
  .catch(function(){cb(null);});}

function sendBooking(cb,pre){var body=pre||{z:S.z,v:S.v,date:S.date,fascia:S.fascia,at:S.at,farmacia:S.farm,comune:S.comune,note:S.note,canale:S.usedVoice?"voce":"testo",hp:$("wz-hp").value,rid:S.rid};var B={z:body.z,v:body.v,date:body.date,fascia:body.fascia};
  var cb0=cb;cb=function(j){if(j&&(j.ok||/^(preso|zona|fascia|ora|dati|data)$/.test(j.error)))pend("del",body);cb0(j);};
  if(!DEMO)pend("add",body);
  if(DEMO){setTimeout(function(){cb({ok:true});},700);return;}
  // stesso codice richiesta (rid) a ogni tentativo: lo script non crea mai doppioni
  // Se la risposta non arriva bene, NON reinvio alla cieca: prima controllo l'agenda.
  // Se la fascia scelta non è più libera, vuol dire che la prenotazione è già entrata: è un successo.
  function check(after){fetch(API_URL+"?action=slots&z="+B.z+"&v="+B.v).then(function(r){return r.json();})
    .then(function(j){if(!j.ok)throw 0;var d=j.days.filter(function(x){return x.d===B.date;})[0];after(!d||d.f.indexOf(B.fascia)<0);})
    .catch(function(){after(null);});}
  var tried=false;
  function go(n){fetch(API_URL,{method:"POST",keepalive:true,headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)})
    .then(function(r){return r.text();}).then(function(t){var j;try{j=JSON.parse(t);}catch(_){j={ok:false,error:"risposta"};}return j;})
    .catch(function(){return {ok:false,error:"rete"};})
    .then(function(j){
      if(j.ok){cb(j);return;}
      if(j.error==="preso"&&tried){cb({ok:true});return;}         // l'ha già registrata il primo invio
      if(/^(preso|zona|fascia|ora|dati|data|limite)$/.test(j.error)){cb(j);return;}

  else bot("**"+cap(fmtDay(S.date))+"**: quale fascia preferisce? "+f.map(span).join(" oppure ")+".",f.map(function(x){return {l:hT(x)+" – "+hT(toT(toM(x)+DUR)),v:"dalle "+x};}).concat([{l:"Altro giorno"}]));}

  else if(S.step==="fascia"){k=ordinal(p,f.length);if(k<0&&f.length===1&&isYes(p))k=0;}
  if(k>=0){S.fascia=f[k];askAt();return true;}
  if((/\bmattin/.test(p)||/\bpomerig/.test(p))&&S.step==="fascia"){bot("Quel giorno "+(/\bmattin/.test(p)?"la mattina":"il pomeriggio")+" non è libero. Posso proporle "+f.map(span).join(" oppure ")+".",["Altro giorno"]);return true;}
  return false;}
function askAt(){S.step="at";var s=toM(S.fascia),ch=[];for(var m=s;m<s+DUR;m+=STEP)ch.push(hT(toT(m)));
  bot("Bene, fascia "+span(S.fascia)+". A che ora preferisce iniziare? Può scegliere tra le "+hT(S.fascia)+" e le "+hT(toT(s+DUR-STEP))+", ogni quarto d'ora.",ch);}
function askFarm(){S.step="farm";bot("Perfetto: **"+fmtDay(S.date)+" alle "+hT(S.at)+"**. Come si chiama la farmacia o parafarmacia?");}
function askNote(){S.step="note";bot("Vuole lasciare una nota per Walter, per esempio l'argomento dell'incontro? Se no, dica «nessuna».",["Nessuna nota"]);}
function askConfirm(){S.step="confirm";
  bot("Riepilogo: **"+S.farm+"**, "+S.comune+" ("+vName()+"). **"+fmtDay(S.date)+" alle "+hT(S.at)+"**."+(S.note?" Nota: "+S.note+".":"")+" Invio la richiesta?",
    [{l:"Sì, invia",big:true,v:"sì confermo"},"Cambia giorno o orario","Cambia farmacia","Annulla"]);}
function cap(s){s=s.trim();return s.charAt(0).toUpperCase()+s.slice(1);}
function cleanFarm(t){var r=cleanFarm0(t),m=norm(t).match(/\b(parafarmacia|farmacia)\b/);if(m&&!/farmacia/i.test(r))r=cap(m[1])+" "+r;return r;}
function cleanFarm0(t){return cap(t.replace(/^\s*(la |il )?(farmacia |parafarmacia )?(nome (della farmacia )?(è|e) |si chiama |chiama |mi chiamo |sono (la |della |dalla )?|siamo (la )?|è (la )?)/i,"").replace(/[.!]+$/,""));}

function handle(text){var p=P(text);
  if(/\b(ricomincia|da capo|ricominciamo|dall inizio)\b/.test(p)){S.di=null;start();return;}
  if(/\b(aiuto|non capisco|come funziona)\b/.test(p)){bot("Le chiedo il comune, poi le propongo i giorni liberi di Walter. Può rispondere a voce, scrivendo o toccando i pulsanti. Per ricominciare dica «ricomincia».",null);return;}
  var x,v,dk,i;
  switch(S.step){
  case "comune":
    if(/\bprovinci/.test(p)&&(x=findProv(p))){S.z=x;S.comune=null;askValle();return;}
    if((x=findComune(p))){setPlace(x);goDays("Bene, "+x.c+". ");return;}
    if((x=findProv(p))){S.z=x;S.comune=null;askValle();return;}
    S.comune=cap(text.replace(/^\s*(a |ad |in |di |sono a |sono di |siamo a |si trova a )/i,"").replace(/[.!]+$/,""));
    S.step="prov";bot("Non trovo «"+S.comune+"» tra i comuni delle zone di Walter. In quale provincia si trova: Brescia, Bolzano o Trento?",["Brescia","Bolzano","Trento"]);return;
  case "prov":
    if((x=findComune(p))&&x.c!=="Bolzano"&&x.c!=="Trento"){setPlace(x);goDays("Bene, "+x.c+". ");return;}
    if((x=findProv(p))){S.z=x;askValle();return;}
    bot("Mi dica solo la provincia: Brescia, Bolzano o Trento.",["Brescia","Bolzano","Trento"]);return;
  case "valle":
    if((v=findValle(p,S.z))){S.v=v.id;if(!S.comune){var c=findComune(p,S.z);if(c&&c.v===v.id&&!VALLI[S.z].some(function(q){return p.indexOf(" "+norm(q.n)+" ")>=0;})){S.comune=c.c;goDays();}else askComune2();}else goDays();return;}
    bot("Non ho capito la zona. Può scegliere tra: "+VALLI[S.z].map(function(v){return v.n;}).join(", ")+".",VALLI[S.z].map(function(v){return v.n;}));return;
  case "comune2":
    if((x=findComune(p,S.z))){setPlace(x);}else S.comune=cap(text.replace(/^\s*(a |ad |in |di )/i,"").replace(/[.!]+$/,""));
    goDays();return;
  case "day": case "fascia":
    dk=parseDate(p,S.days.map(function(d){return d.d;}));
    if(dk&&dk!==S.date){i=S.days.findIndex(function(d){return d.d===dk;});
      if(i>=0){pickDay(i,p);return;}
      var nx=S.days.findIndex(function(d){return d.d>dk;});
      if(nx<0){S.di=S.days.length-1;proposeDay(cap(fmtDay(dk))+" non è prenotabile. ");return;}
      S.di=nx;proposeDay("Mi dispiace, "+fmtDay(dk)+" non ho fasce libere per la sua zona. ");return;}
    if(/\b(altr[oa]|dopo|successiv|prossim[oa]|avanti|piu avanti)\b/.test(p)||(S.step==="day"&&isNo(p))){
      if(S.di+1>=S.days.length){S.di=0;proposeDay("Non ho altri giorni liberi nelle prossime 8 settimane. Ricomincio dal primo: ");return;}
      S.di++;proposeDay("");return;}
    if(/\b(precedent|indietro|prima di)\b/.test(p)&&S.di>0){S.di--;proposeDay("");return;}
    if(S.step==="day"){if(isYes(p)||times(p,false).length||/\b(mattin|pomerig)/.test(p)){pickDay(S.di,p);return;}
      bot("Mi dica «va bene», «un altro giorno», oppure una data, per esempio «giovedì» o «il 12 dicembre».",[{l:"Sì, va bene"},{l:"Altro giorno"}]);return;}
    if(tryFascia(p))return;
    if(isNo(p)){S.di=(S.di+1)%S.days.length;proposeDay("");return;}
    askFascia();return;
  case "at":
    var ts=times(p,true),s=toM(S.fascia);
    if(/\b(indifferente|quando vuole|come preferisce|all inizio|subito|prima possibile|va bene)\b/.test(p)&&!ts.length)ts=[s];
    for(i=0;i<ts.length;i++){if(ts[i]>=s&&ts[i]<s+DUR){S.at=toT(ts[i]-(ts[i]-s)%STEP);askFarm();return;}}
    bot("L'ora di inizio deve essere tra le "+hT(S.fascia)+" e le "+hT(toT(s+DUR-STEP))+". A che ora preferisce?",(function(){var c=[];for(var m=s;m<s+DUR;m+=STEP)c.push(hT(toT(m)));return c;})());return;
  case "farm":
    var n=cleanFarm(text);if(n.length<2){bot("Non ho capito il nome. Come si chiama la farmacia?");return;}
    S.farm=n;if(S.fix){S.fix=false;askConfirm();}else askNote();return;
  case "note":
    S.note=/^ (no|nessun\w*|niente|non serve|non ho|nulla)\b/.test(p)?"":text.trim().slice(0,500);askConfirm();return;
  case "confirm":
    if(/\bannull/.test(p)){S.step="end";bot("Va bene, non ho registrato niente. A presto!",["Ricomincia"],true);return;}
    if(/\b(giorn\w*|data|orari\w*|ora)\b/.test(p)){proposeDay("Va bene, cambiamo. ");return;}
    if(/\b(farmaci\w*|nome)\b/.test(p)){S.fix=true;askFarm();return;}
    if(/\b(comune|zona|provinci\w*)\b/.test(p)){S.di=null;start();return;}
    if(/\bnot[ae]\b/.test(p)){askNote();return;}
    if(isYes(p)){submit();return;}
    bot("Cosa vuole cambiare?",["Cambia giorno o orario","Cambia farmacia","Cambia comune","Annulla"]);return;
  case "end":
    S.di=null;start();return;
  }}
// Risposta immediata al cliente: la richiesta viaggia in sottofondo (con controlli e nuovi tentativi).
// Solo se proprio non entra, compare un avviso in più.
function submit(){if(!S.rid)S.rid=Date.now().toString(36)+Math.random().toString(36).slice(2,10);
  var quando=fmtDay(S.date)+" alle "+hT(S.at);delete cache[S.z+"|"+S.v];
  S.step="end";
  bot("Grazie per la prenotazione! L'appuntamento è confermato per **"+quando+"**. Se ci fossero modifiche, la contatterà Walter. Buona giornata!",[{l:"Nuova prenotazione",v:"ricomincia"}],true);
  sendBooking(function(r){
    if(r&&r.ok)return;
    if(r&&r.error==="preso")return; // mai riproporre altre date dopo il "sì"
    if(r&&r.error==="limite"){bot("Attenzione: in questo momento il sistema ha ricevuto troppe richieste e la sua non è ancora registrata. La rimanderò automaticamente la prossima volta che apre questa pagina; se preferisce, chiami Walter al "+PHONE+".",[{l:"Nuova prenotazione",v:"ricomincia"}],true);return;}
    bot("Attenzione: non sono riuscito a registrare la richiesta per "+quando+" (codice: "+((r&&r.error)||"?")+"). La prego di riprovare tra poco oppure di chiamare Walter al "+PHONE+".",[{l:"Riprova",v:"ricomincia"}],true);});}

W.WZVA={handle:function(t){user(t);},state:function(){return S;}};
setVoice(!!TTS);
// richieste rimaste a metà (pagina chiusa subito dopo il "sì"): le rimando in silenzio
if(!DEMO)setTimeout(function(){pend("list").forEach(function(x){sendBooking(function(){},x.b);});},2000);
})();
</script>

<script>
(function(){
var API=window.WZVA_API, el=document.getElementById("adm");
var PIN=null;try{PIN=localStorage.getItem("wz-pin");}catch(_){}
var A={view:"rich",week:0,data:null,open:{}};
var GIORNI=["dom","lun","mar","mer","gio","ven","sab"],MESI=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
var ZC={BS:"var(--bs)",BZ:"var(--bz)",TN:"var(--tn)"};
function dOf(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function fd(k){var d=dOf(k);return GIORNI[d.getDay()]+" "+d.getDate()+" "+MESI[d.getMonth()];}
function hT(t){return (+t.slice(0,2))+":"+t.slice(3,5);}
function end(f){var m=+f.slice(0,2)*60+ +f.slice(3,5)+120;return Math.floor(m/60)+":"+("0"+m%60).slice(-2);}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function toast(t){var x=document.getElementById("toast");x.textContent=t;x.style.display="block";clearTimeout(toast.k);toast.k=setTimeout(function(){x.style.display="none";},3500);}
var DEMO=!/^https:\/\/script\.google\.com\/.+\/exec$/.test(API||"");
function call(o,cb){o.admin=1;o.pin=PIN;
  if(DEMO){setTimeout(function(){cb(demo(o));},300);return;}
  fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(o)}).then(function(r){return r.text();})
  .then(function(t){try{cb(JSON.parse(t));}catch(_){cb({ok:false,error:"risposta"});}}).catch(function(){cb({ok:false,error:"rete"});});}
// dati finti per la modalità prova
var DM=null;function demo(o){if(o.pin!=="1234")return{ok:false,error:"pin"};if(o.op==="login")return{ok:true};
  if(!DM){DM={days:[],lista:[]};var d=new Date();d.setHours(0,0,0,0);for(var i=1;DM.days.length<40;i++){var x=new Date(d);x.setDate(d.getDate()+i);var w=x.getDay();if(w<1||w>5)continue;
    var k=x.getFullYear()+"-"+("0"+(x.getMonth()+1)).slice(-2)+"-"+("0"+x.getDate()).slice(-2);
    DM.days.push({d:k,solo:"",fasce:["08:00","10:30","14:00"].map(function(f,j){var am=j<2,z=["BS","BZ","TN"].filter(function(z){return z==="BS"?(w===1||w===5):z==="BZ"?(w<=4||am):(w<=4&&!am)||(w>=2&&w<=4&&am);});
      return (i*3+j)%7===0?{f:f,stato:"occupato"}:{f:f,stato:z.length?"libero":"fuorizona",zone:z};})});}
    var a=DM.days[1].fasce[2];a.stato="attesa";a.id="d1";a.farm="Farmacia San Paolo";a.com="Brunico";DM.days[1].solo="Val Pusteria e Val Badia";
    var b=DM.days[3].fasce[0];b.stato="prenotato";b.id="d2";b.farm="Farmacia Centrale";b.com="Merano";
    DM.lista=[{id:"d1",d:DM.days[1].d,ora:"14:45",stato:"attesa",farm:"Farmacia San Paolo",com:"Brunico",zona:"Val Pusteria e Val Badia"},
      {id:"d2",d:DM.days[3].d,ora:"08:30",stato:"confermata",farm:"Farmacia Centrale",com:"Merano",zona:"Merano e Val Passiria"}];}
  if(o.op==="agenda")return{ok:true,days:DM.days,lista:DM.lista};
  if(o.op==="conferma"){DM.lista.forEach(function(x){if(x.id===o.id)x.stato="confermata";});DM.days.forEach(function(d){d.fasce.forEach(function(f){if(f.id===o.id)f.stato="prenotato";});});return{ok:true,msg:"Confermata! (prova)"};}
  if(o.op==="rifiuta"||o.op==="annulla"){DM.lista=DM.lista.filter(function(x){return x.id!==o.id;});DM.days.forEach(function(d){d.fasce.forEach(function(f){if(f.id===o.id){f.stato="libero";f.zone=["BZ"];delete f.id;}});});return{ok:true,msg:"Fatto (prova)"};}
  if(o.op==="oscura"){DM.days.forEach(function(d){if(d.d===o.date)d.fasce.forEach(function(f){if(f.f===o.fascia){f.stato="oscurato";f.id="o"+Date.now();}});});return{ok:true};}
  if(o.op==="riapri"){DM.days.forEach(function(d){d.fasce.forEach(function(f){if(f.id===o.id){f.stato="libero";f.zone=["BZ"];delete f.id;}});});return{ok:true};}
  return{ok:false};}
var ERR={pin:"PIN sbagliato.",nopin:"Il PIN non è ancora impostato nello script Google (riga PIN).",bloccato:"Troppi tentativi: riprova tra 15 minuti.",rete:"Connessione assente. Riprova.",risposta:"Lo script non ha risposto bene. Riprova.",server:"Errore dello script. Riprova.",nontrovato:"Non trovato: forse è già stato cancellato."};
function login(){el.innerHTML='<div class="top"><h1>Area Walter</h1></div><form class="pin" id="pf"><svg viewBox="0 0 24 24" width="48" height="48" style="margin:0 auto;color:var(--a)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><b>Inserisci il tuo PIN</b>'+
  (DEMO?'<span class="empty">Modalità prova: PIN 1234</span>':'')+'<input id="pi" type="password" inputmode="numeric" autocomplete="current-password" aria-label="PIN"><div class="err" id="pe"></div><button class="btn">Entra</button></form>';
  document.getElementById("pf").onsubmit=function(e){e.preventDefault();PIN=document.getElementById("pi").value.trim();var b=this.querySelector("button");b.disabled=true;
    call({op:"login"},function(r){b.disabled=false;if(r.ok){try{localStorage.setItem("wz-pin",PIN);}catch(_){}load();}else document.getElementById("pe").textContent=ERR[r.error]||"Errore.";});};
  setTimeout(function(){var i=document.getElementById("pi");i&&i.focus();},50);}
function load(){if(!A.data)el.innerHTML='<div class="top"><h1>Area Walter</h1></div><div class="wrap"><p class="empty">Carico la tua agenda…</p></div>';
  call({op:"agenda"},function(r){if(!r.ok){if(r.error==="pin"||r.error==="nopin"){PIN=null;try{localStorage.removeItem("wz-pin");}catch(_){}login();return;}toast(ERR[r.error]||"Errore");return;}A.data=r;render();});}
function render(){var r=A.data,att=r.lista.filter(function(x){return x.stato==="attesa";});
  var h='<div class="top"><h1>Area Walter</h1><button id="rf">Aggiorna</button><button id="lo">Esci</button></div><div class="wrap">'+
   '<div class="seg" role="tablist"><button data-v="rich" aria-selected="'+(A.view==="rich")+'">Richieste'+(att.length?' ('+att.length+')':'')+'</button><button data-v="sett" aria-selected="'+(A.view==="sett")+'">Settimana</button></div>';
  h+=A.view==="rich"?rich(r):sett(r);el.innerHTML=h+'</div>';
  el.querySelector("#rf").onclick=function(){load();toast("Aggiornato");};
  el.querySelector("#lo").onclick=function(){PIN=null;A.data=null;try{localStorage.removeItem("wz-pin");}catch(_){}login();};
  el.querySelectorAll(".seg button").forEach(function(b){b.onclick=function(){A.view=b.dataset.v;render();};});
  el.querySelectorAll("[data-op]").forEach(function(b){b.onclick=function(){act(b);};});}
function rich(r){var att=r.lista.filter(function(x){return x.stato==="attesa";}),ok=r.lista.filter(function(x){return x.stato!=="attesa";});
  function card(x){var o=A.open[x.id];return '<div class="card"><div class="t">'+esc(x.farm)+' <span class="pill '+(x.stato==="attesa"?'p-attesa">da confermare':'p-ok">confermato')+'</span></div>'+
    '<div class="m">📅 '+fd(x.d)+' alle '+hT(x.ora)+' · '+esc(x.com)+(x.zona?' ('+esc(x.zona)+')':'')+'</div>'+
    (o?'<p class="m" style="margin-top:10px">La fascia torna libera e l\'evento sparisce dal calendario. La farmacia la avvisi tu.</p><div class="row"><button class="btn no" data-op="'+(x.stato==="attesa"?"rifiuta":"annulla")+'" data-id="'+x.id+'">'+(x.stato==="attesa"?"Sì, rifiuta":"Sì, annulla")+'</button><button class="btn gh" data-op="chiudi" data-id="'+x.id+'">Indietro</button></div>'
     :'<div class="row">'+(x.stato==="attesa"?'<button class="btn" data-op="conferma" data-id="'+x.id+'">✓ Segna confermato</button><button class="btn gh" data-op="apri" data-id="'+x.id+'">Rifiuta…</button>':'<button class="btn gh" data-op="apri" data-id="'+x.id+'">Annulla appuntamento…</button>')+'</div>')+'</div>';}
  return '<h2>Da confermare</h2>'+(att.length?att.map(card).join(""):'<p class="empty">Nessuna richiesta in attesa.</p>')+
    '<h2>Prossimi appuntamenti</h2>'+(ok.length?ok.map(card).join(""):'<p class="empty">Nessun appuntamento confermato.</p>');}
function sett(r){var wk=r.days.slice(A.week*5,A.week*5+5),nw=Math.ceil(r.days.length/5);
  var h='<div class="wk"><button data-op="wp" '+(A.week<=0?"disabled":"")+' aria-label="Settimana precedente">‹</button><span>'+(wk.length?fd(wk[0].d)+' – '+fd(wk[wk.length-1].d):'')+'</span><button data-op="wn" '+(A.week>=nw-1?"disabled":"")+' aria-label="Settimana successiva">›</button></div>';
  wk.forEach(function(d){h+='<div class="day"><div class="dh"><b>'+fd(d.d)+'</b>'+(d.solo?'<small>solo '+esc(d.solo)+'</small>':'')+'</div>';
    d.fasce.forEach(function(f){var x='',btn='';
      if(f.stato==="libero"){x=f.zone.map(function(z){return '<span class="z" style="background:'+ZC[z]+'">'+z+'</span>';}).join("")+'libero';btn='<button data-op="oscura" data-d="'+d.d+'" data-f="'+f.f+'">Oscura</button>';}
      else if(f.stato==="oscurato"){x='🚫 oscurato da te';btn='<button data-op="riapri" data-id="'+f.id+'">Riapri</button>';}
      else if(f.stato==="attesa")x='⏳ '+esc(f.farm)+' <span class="pill p-attesa">da confermare</span>';
      else if(f.stato==="prenotato")x='✓ '+esc(f.farm)+' ('+esc(f.com)+')';
      else if(f.stato==="occupato")x='impegno in agenda';
      else x='fuori zona';
      h+='<div class="fs '+f.stato+'"><span class="o">'+hT(f.f)+'–'+end(f.f)+'</span><span class="x">'+x+'</span>'+btn+'</div>';});
    h+='</div>';});
  return h+'<p class="empty">«Oscura» blocca la fascia per i clienti (crea un evento «Non prenotabile» nel calendario LAVORO). Gli impegni presi direttamente su Google Calendar compaiono qui da soli.</p>';}
function act(b){var op=b.dataset.op,id=b.dataset.id;
  if(op==="wp"){A.week--;render();return;}if(op==="wn"){A.week++;render();return;}
  if(op==="apri"){A.open[id]=1;render();return;}if(op==="chiudi"){delete A.open[id];render();return;}
  var o={op:op,id:id};if(op==="oscura"){o.date=b.dataset.d;o.fascia=b.dataset.f;}
  b.disabled=true;b.textContent="…";
  call(o,function(r){if(!r.ok){toast(ERR[r.error]||"Errore");render();return;}delete A.open[id];toast(r.msg||(op==="oscura"?"Fascia oscurata":op==="riapri"?"Fascia riaperta":"Fatto"));load();});}
// schede in basso
function tab(adm){document.body.classList.toggle("adm",adm);document.getElementById("t-pre").setAttribute("aria-selected",!adm);document.getElementById("t-adm").setAttribute("aria-selected",adm);
  if(adm){try{window.speechSynthesis&&speechSynthesis.cancel();}catch(_){}if(PIN)load();else login();}
  try{history.replaceState(null,"",adm?"#walter":location.pathname);}catch(_){}}
document.getElementById("t-pre").onclick=function(){tab(false);};document.getElementById("t-adm").onclick=function(){tab(true);};
if(location.hash==="#walter")tab(true);
if(window.WZVA_OPEN)window.WZVA_OPEN();
// installazione
var standalone=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone;
var seen=false;try{seen=!!localStorage.getItem("wz-inst");}catch(_){}
var I=document.getElementById("inst"),deferred=null;
function showInst(t,btn){if(standalone||seen)return;document.getElementById("inst-t").textContent=t;document.getElementById("inst-b").hidden=!btn;I.style.display="flex";}
document.getElementById("inst-x").onclick=function(){I.style.display="none";try{localStorage.setItem("wz-inst","1");}catch(_){}};
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferred=e;showInst("Aggiungi l'icona alla schermata Home per aprirla come un'app.",true);});
document.getElementById("inst-b").onclick=function(){if(deferred){deferred.prompt();deferred=null;}I.style.display="none";};
if(/iphone|ipad|ipod/i.test(navigator.userAgent))setTimeout(function(){showInst("Tocca il tasto Condividi (il quadrato con la freccia) e poi «Aggiungi alla schermata Home».",false);},2500);
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
